<!DOCTYPE html>
<html>
<head>
    <title>ASU Auth Test</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDa8jBTAxpNw_01cYdke_IQqAS7dh83d6k",
            authDomain: "asu-textbook-marketplace.firebaseapp.com",
            projectId: "asu-textbook-marketplace",
            storageBucket: "asu-textbook-marketplace.firebasestorage.app",
            messagingSenderId: "275260067181",
            appId: "1:275260067181:web:2abd6a3f46f484bad69e64"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.testAuth = async () => {
            console.log('🧪 Testing ASU Authentication System...');
            
            try {
                console.log('Starting Google sign-in...');
                const provider = new GoogleAuthProvider();
                
                const result = await signInWithPopup(auth, provider).catch(error => {
                    console.error('Sign-in error:', error);
                    throw error;
                });
                
                console.log('✅ Google sign in successful');
                console.log('Email:', result.user.email);
                
                // Test ASU email verification
                if (result.user.email.endsWith('@asu.edu')) {
                    console.log('✅ ASU email verified');
                    
                    // Create user document
                    const userRef = doc(db, 'users', result.user.uid);
                    const userSnap = await getDoc(userRef);
                    
                    if (!userSnap.exists()) {
                        await setDoc(userRef, {
                            uid: result.user.uid,
                            name: result.user.displayName,
                            asuEmail: result.user.email,
                            reputation: { completedTrades: 0, rating: 5.0 },
                            createdAt: new Date()
                        });
                        console.log('✅ User document created');
                    } else {
                        console.log('✅ User document already exists');
                    }
                    
                    // Sign out
                    await signOut(auth);
                    console.log('✅ Sign out successful');
                    console.log('🎉 All tests passed! ASU authentication working correctly!');
                    
                } else {
                    console.log('❌ Non-ASU email detected');
                    console.log('🚫 Test failed - Only ASU emails are allowed');
                    console.log('💡 This is the correct behavior - non-ASU emails should be rejected');
                    
                    // Sign out the non-ASU user
                    await signOut(auth);
                    console.log('✅ Sign out successful');
                    console.log('✅ ASU email verification working correctly - non-ASU email rejected');
                }
                
            } catch (error) {
                console.error('❌ Auth test failed:', error);
                console.error('Error details:', error.message);
            }
        };
    </script>
</head>
<body>
    <h1>ASU Authentication Test</h1>
    <button onclick="testAuth()">Test Authentication</button>
    <p>Open browser console to see results</p>
    <p><strong>Test with both ASU and non-ASU emails to verify the system works correctly!</strong></p>
</body>
</html>
