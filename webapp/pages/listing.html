<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Listing Detail</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Arial;margin:20px}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px;max-width:560px}
    button{padding:8px 12px;border-radius:10px;border:1px solid #888;cursor:pointer}
    dialog{border-radius:12px}
  </style>
</head>
<body>
  <div class="card">
    <h2 id="title">...</h2>
    <p id="meta"></p>
    <p><b>Status:</b> <span id="status">...</span></p>

    <div style="margin:10px 0">
      <button id="btnSeller">Sign in as Seller (u1)</button>
      <button id="btnBuyer">Sign in as Buyer (u2)</button>
      <span id="who" style="margin-left:10px;color:#555"></span>
    </div>

    <button id="btnPropose">Propose meetup</button>
  </div>

  <dialog id="dlg">
    <form method="dialog">
      <h3>Propose a meetup</h3>
      <label>Spot
        <select id="spot">
          <option>Hayden Library Lobby</option>
          <option>MU Starbucks</option>
          <option>Student Services Lawn</option>
          <option>Polytechnic Student Union Desk</option>
        </select>
      </label>
      <br/><br/>
      <label>Time
        <input id="time" type="datetime-local" required />
      </label>
      <menu>
        <button value="cancel">Cancel</button>
        <button id="send" value="default">Send proposal</button>
      </menu>
    </form>
  </dialog>

  <script type="module">
    import { signInAs, currentUser, getListing, proposeMeetup } from "../services/meetups.demo.js";

    const $ = s => document.querySelector(s);
    function toast(msg){ alert(msg); }

    // --- load listing
    const id = new URLSearchParams(location.search).get('id') || 'seed1';
    const listing = getListing(id);
    $("#title").textContent = listing.title + " — $" + listing.price.toFixed(2);
    $("#meta").textContent = `${listing.author} • ${listing.courseCodes.join(", ")} • ISBN ${listing.isbn}`;
    $("#status").textContent = listing.status;

    function showUser(){
      const u = currentUser();
      $("#who").textContent = `Signed in: ${u.displayName} (${u.uid})`;
    }
    $("#btnSeller").onclick = ()=> { signInAs('u1'); showUser(); };
    $("#btnBuyer").onclick  = ()=> { signInAs('u2'); showUser(); };
    showUser();

    // --- propose meetup
    $("#btnPropose").onclick = ()=> $("#dlg").showModal();
    $("#send").onclick = async (e)=>{
      e.preventDefault();
      const buyer = currentUser();
      const sellerUid = listing.ownerUid;
      const spot = $("#spot").value;
      const dt = $("#time").value;
      if(!dt){ toast("Pick a time"); return; }
      const timeISO = new Date(dt).toISOString();

      try {
        await proposeMeetup({ listingId:id, buyerUid:buyer.uid, sellerUid, spot, timeISO });
        $("#dlg").close(); toast("Proposal sent!");
      } catch (err) {
        toast(err.message || "Failed");
      }
    };
  </script>
</body>
</html>
